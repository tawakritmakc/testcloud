<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ระบบแจ้งพัสดุหอพัก</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --bg:#f6f5f2; --card:#fff; --ink:#1f2328; --muted:#6b6f76; --line:#e2e0db; --accent:#2563eb; --ok:#15803d; --err:#b91c1c; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:'Sarabun',sans-serif; background:var(--bg); color:var(--ink); }
  main { max-width:860px; margin:0 auto; padding:24px 16px 48px; }
  h1 { font-size:1.5rem; margin:0 0 4px; }
  .sub { color:var(--muted); margin:0 0 20px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:20px; margin-bottom:20px; }
  h2 { font-size:1.15rem; margin:0 0 14px; }
  label { display:block; font-weight:600; margin:12px 0 6px; }
  select, input[type=file] { width:100%; padding:10px; border:1px solid var(--line); border-radius:8px; font:inherit; background:#fff; }
  button { font:inherit; border:0; border-radius:8px; padding:10px 18px; cursor:pointer; background:var(--accent); color:#fff; font-weight:600; }
  button:disabled { opacity:.5; cursor:wait; }
  button.small { padding:6px 12px; font-size:.9rem; }
  #preview { max-width:220px; max-height:220px; margin-top:10px; border-radius:8px; display:none; }
  .msg { margin-top:12px; font-weight:600; }
  .msg.ok { color:var(--ok); } .msg.err { color:var(--err); }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:10px 8px; border-bottom:1px solid var(--line); vertical-align:middle; }
  th { color:var(--muted); font-weight:600; font-size:.9rem; }
  td img { width:56px; height:56px; object-fit:cover; border-radius:6px; }
  .empty { color:var(--muted); text-align:center; padding:20px; }
  .row-head { display:flex; justify-content:space-between; align-items:center; }
  @media (max-width:600px) { .hide-sm { display:none; } }
</style>
</head>
<body>
<main>
  <h1>📦 ระบบแจ้งพัสดุหอพัก</h1>
  <p class="sub">สำหรับเจ้าหน้าที่ · แจ้งพัสดุแล้วผู้พักจะได้อีเมลพร้อมรหัสรับ 4 หลัก</p>

  <section class="card">
    <h2>แจ้งพัสดุใหม่</h2>
    <form id="parcelForm">
      <label for="room">ห้อง</label>
      <select id="room" required><option value="">กำลังโหลด...</option></select>

      <label for="carrier">ขนส่ง</label>
      <select id="carrier">
        <option>Kerry Express</option><option>Flash Express</option><option>ไปรษณีย์ไทย</option>
        <option>J&T Express</option><option>Shopee Express</option><option>Lazada Express</option><option>อื่นๆ</option>
      </select>

      <label for="photo">รูปพัสดุ</label>
      <input type="file" id="photo" accept="image/*" capture="environment">
      <img id="preview" alt="ตัวอย่างรูปพัสดุ">

      <div style="margin-top:16px"><button type="submit" id="submitBtn">แจ้งพัสดุ</button></div>
      <div id="formMsg" class="msg"></div>
    </form>
  </section>

  <section class="card">
    <div class="row-head">
      <h2>พัสดุที่ยังไม่มีคนรับ</h2>
      <button class="small" id="refreshBtn" type="button">รีเฟรช</button>
    </div>
    <table>
      <thead><tr><th>รูป</th><th>ห้อง</th><th class="hide-sm">ขนส่ง</th><th>มาถึง</th><th></th></tr></thead>
      <tbody id="parcelRows"><tr><td colspan="5" class="empty">กำลังโหลด...</td></tr></tbody>
    </table>
    <div id="listMsg" class="msg"></div>
  </section>
</main>

<script src="config.js"></script>
<script>
const $ = id => document.getElementById(id);
let photoData = "";

function showMsg(el, text, ok) { el.textContent = text; el.className = "msg " + (ok ? "ok" : "err"); }

function thaiTime(iso) {
  const d = new Date(iso);
  return d.toLocaleString("th-TH", { dateStyle: "short", timeStyle: "short", timeZone: "Asia/Bangkok" });
}

async function api(path, options = {}) {
  const res = await fetch(API_URL + path, {
    ...options, headers: { "Content-Type": "application/json", ...(options.headers || {}) }
  });
  const body = await res.json().catch(() => ({}));
  return { ok: res.ok, status: res.status, body };
}

async function loadRooms() {
  const { ok, body } = await api("/residents");
  const sel = $("room");
  if (!ok) { sel.innerHTML = '<option value="">โหลดรายการห้องไม่ได้</option>'; return; }
  sel.innerHTML = '<option value="">-- เลือกห้อง --</option>' +
    body.map(r => `<option value="${r.room}">${r.room} · ${r.name}</option>`).join("");
}

// ย่อรูปให้ด้านยาวไม่เกิน 1280 px แล้วแปลงเป็น JPEG base64 (Lambda รับได้ไม่เกิน 6 MB)
function resizeImage(file, maxSize = 1280) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, maxSize / Math.max(img.width, img.height));
      const canvas = document.createElement("canvas");
      canvas.width = Math.round(img.width * scale);
      canvas.height = Math.round(img.height * scale);
      canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
      URL.revokeObjectURL(img.src);
      resolve(canvas.toDataURL("image/jpeg", 0.8));
    };
    img.onerror = reject;
    img.src = URL.createObjectURL(file);
  });
}

$("photo").addEventListener("change", async e => {
  const file = e.target.files[0];
  if (!file) { photoData = ""; $("preview").style.display = "none"; return; }
  photoData = await resizeImage(file);
  $("preview").src = photoData;
  $("preview").style.display = "block";
});

$("parcelForm").addEventListener("submit", async e => {
  e.preventDefault();
  const room = $("room").value;
  if (!room) { showMsg($("formMsg"), "กรุณาเลือกห้อง", false); return; }
  $("submitBtn").disabled = true;
  showMsg($("formMsg"), "กำลังบันทึก...", true);
  const { ok, body } = await api("/parcels", {
    method: "POST",
    body: JSON.stringify({ room, carrier: $("carrier").value, photo: photoData })
  });
  $("submitBtn").disabled = false;
  if (ok) {
    showMsg($("formMsg"), `แจ้งพัสดุห้อง ${room} สำเร็จ ส่งอีเมลถึงผู้พักแล้ว`, true);
    $("parcelForm").reset(); photoData = ""; $("preview").style.display = "none";
    loadParcels();
  } else {
    showMsg($("formMsg"), "ผิดพลาด: " + (body.message || "ไม่ทราบสาเหตุ"), false);
  }
});

async function loadParcels() {
  const { ok, body } = await api("/parcels");
  const tbody = $("parcelRows");
  if (!ok) { tbody.innerHTML = '<tr><td colspan="5" class="empty">โหลดรายการไม่ได้</td></tr>'; return; }
  if (!body.length) { tbody.innerHTML = '<tr><td colspan="5" class="empty">ไม่มีพัสดุค้าง 🎉</td></tr>'; return; }
  tbody.innerHTML = body.map(p => `
    <tr>
      <td>${p.photoUrl ? `<a href="${p.photoUrl}" target="_blank"><img src="${p.photoUrl}" alt="พัสดุ"></a>` : "-"}</td>
      <td><strong>${p.room}</strong></td>
      <td class="hide-sm">${p.carrier}</td>
      <td>${thaiTime(p.createdAt)}</td>
      <td><button class="small" onclick="pickup('${p.parcelId}', '${p.room}')">รับพัสดุ</button></td>
    </tr>`).join("");
}

async function pickup(id, room) {
  const code = prompt(`กรอกรหัสรับพัสดุ 4 หลักของห้อง ${room}`);
  if (code === null) return;
  const { ok, body } = await api(`/parcels/${id}/pickup`, {
    method: "POST", body: JSON.stringify({ code: code.trim() })
  });
  const msgs = {
    "Parcel picked up": "รับพัสดุเรียบร้อย",
    "Invalid pickup code": "รหัสไม่ถูกต้อง",
    "Parcel already picked up": "พัสดุนี้ถูกรับไปแล้ว"
  };
  showMsg($("listMsg"), msgs[body.message] || body.message || "ผิดพลาด", ok);
  loadParcels();
}

$("refreshBtn").addEventListener("click", loadParcels);
loadRooms();
loadParcels();
</script>
</body>
</html>
